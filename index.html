<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PetDost tag</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --orange: #ff7a45; --orange-deep: #e85d2a; --cream: #fff9f4; --ink: #2a211c;
    --soft: #7a6d66; --line: #e6dcd3; --red: #e5537a; --red-bg: #fcdde6; --teal: #1f9e8f;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .logo { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--orange), var(--orange-deep));
          display: grid; place-items: center; color: #fff; font-size: 20px; }
  .brand { font-weight: 700; font-size: 20px; color: var(--orange); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
  .photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #f4ece4; }
  .initial { width: 100%; aspect-ratio: 4 / 3; display: grid; place-items: center; font-size: 96px; font-weight: 700;
             color: #fff; background: linear-gradient(135deg, var(--orange), var(--orange-deep)); }
  .body { padding: 20px; }
  h1 { margin: 0; font-size: 28px; line-height: 1.2; }
  .muted { color: var(--soft); margin: 4px 0 0; }
  .lost { background: var(--red-bg); color: var(--red); border-radius: 16px; padding: 14px 16px; margin-top: 16px; font-weight: 600; }
  .lost p { margin: 6px 0 0; font-weight: 400; color: var(--ink); white-space: pre-wrap; }
  .btn { display: block; width: 100%; text-align: center; text-decoration: none; border: 0; border-radius: 16px;
         padding: 16px; font: 600 17px/1 inherit; cursor: pointer; margin-top: 12px; }
  .primary { background: var(--orange); color: #fff; }
  .call { background: var(--teal); color: #fff; }
  .secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  form { margin-top: 20px; display: grid; gap: 12px; }
  label { font-weight: 600; font-size: 14px; display: grid; gap: 6px; }
  input, textarea { font: inherit; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); width: 100%; }
  textarea { min-height: 96px; resize: vertical; }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 400; }
  .check input { width: 20px; height: 20px; }
  .center { text-align: center; padding: 48px 8px; }
  .big { font-size: 56px; }
  .error { color: var(--red); font-size: 14px; }
  footer { text-align: center; color: var(--soft); font-size: 13px; margin-top: 24px; }
  .lang { margin-left: auto; display: flex; gap: 6px; }
  .lang button { font: 600 14px/1 inherit; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line);
                 background: #fff; color: var(--ink); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">🐾</div><div class="brand">PetDost</div>
    <div class="lang" role="group" aria-label="भाषा / Language">
      <button type="button" data-lang="hi">हिंदी</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </header>

  <section id="loading" class="center"><div class="big">🐾</div><p class="muted" data-t="loading"></p></section>

  <section id="notFound" class="center" hidden>
    <div class="big">🔍</div>
    <h1 data-t="notFoundTitle"></h1>
    <p class="muted" data-t="notFoundBody"></p>
  </section>

  <section id="pet" hidden>
    <div class="card">
      <div id="photoSlot"></div>
      <div class="body">
        <h1 id="petName"></h1>
        <p class="muted" id="petMeta"></p>
        <div class="lost" id="lostBanner" hidden><span data-t="lost"></span><p id="lostMessage"></p></div>
        <a class="btn call" id="callBtn" hidden data-t="call"></a>
        <button class="btn primary" id="foundBtn" type="button"></button>
      </div>
    </div>

    <form id="reportForm" class="card body" hidden>
      <strong data-t="tellFamily"></strong>
      <label><span data-t="yourName"></span> <input name="name" maxlength="60" autocomplete="name"></label>
      <label><span data-t="yourPhone"></span> <input name="phone" maxlength="20" inputmode="tel" autocomplete="tel" data-t-placeholder="phoneHint"></label>
      <label><span data-t="message"></span> <textarea name="message" maxlength="500" data-t-placeholder="messageHint"></textarea></label>
      <label class="check"><input type="checkbox" name="location" checked> <span data-t="shareLocation"></span></label>
      <p class="error" id="formError" hidden></p>
      <button class="btn primary" type="submit" id="sendBtn" data-t="send"></button>
    </form>
  </section>

  <section id="thanks" class="center" hidden>
    <div class="big">💛</div>
    <h1 data-t="thanksTitle"></h1>
    <p class="muted" data-t="thanksBody"></p>
  </section>

  <footer data-t="footer"></footer>
</main>

<script>
// petdost-prod. Public anon key: safe to ship - the database only exposes public_tag() and report_sighting().
const SUPABASE_URL = "https://bvjomhokmsggvyypxccr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2am9taG9rbXNnZ3Z5eXB4Y2NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MzkwMzgsImV4cCI6MjEwOTIxNTAzOH0.Mn04WbfAfLoWGP6jh6YL62RyyEgQvWFiMc10UFMKNnM";

const $ = (id) => document.getElementById(id);
const show = (id) => { for (const s of ["loading", "notFound", "pet", "thanks"]) $(s).hidden = s !== id; };
const code = (new URLSearchParams(location.search).get("t") || "").trim().toUpperCase();

// Hindi first (PetDost's home is Muzaffarnagar); the finder can switch at the top.
const TEXT = {
  hi: {
    loading: "खुल रहा है…",
    loadFailed: "खुल नहीं सका। इंटरनेट जाँचें और पेज फिर से खोलें।",
    notFoundTitle: "पहचान पट्टी नहीं मिली",
    notFoundBody: "यह QR कोड किसी पशु से नहीं जुड़ा है। कोड जाँचकर फिर से प्रयास करें।",
    lost: "🚨 मैं खो गया हूँ! कृपया मुझे घर पहुँचाने में मदद करें।",
    call: "📞 मेरे परिवार को फ़ोन करें",
    tellFamily: "परिवार को बताएँ",
    yourName: "आपका नाम",
    yourPhone: "आपका फ़ोन नंबर",
    phoneHint: "ताकि वे आपको वापस फ़ोन कर सकें",
    message: "संदेश",
    messageHint: "आपको यह कहाँ मिला? क्या यह आपके पास सुरक्षित है?",
    shareLocation: "मेरा वर्तमान स्थान भेजें",
    send: "परिवार को भेजें",
    sending: "भेज रहे हैं…",
    inactive: "यह पहचान पट्टी अब चालू नहीं है।",
    tooMany: "इस पशु के लिए अभी बहुत अधिक सूचनाएँ आ चुकी हैं। कृपया कुछ देर बाद प्रयास करें।",
    failed: "कुछ गड़बड़ हो गई। कृपया फिर से प्रयास करें।",
    thanksTitle: "धन्यवाद!",
    thanksBody: "आपकी सूचना परिवार के PetDost ऐप पर भेज दी गई। अगर आपने नंबर दिया है, तो वे आपको फ़ोन कर सकते हैं।",
    footer: "हर PetDost पहचान पट्टी निजी है: हम वही दिखाते हैं जो मालिक दिखाना चाहते हैं।",
    hi: (name) => `नमस्ते, मैं ${name} हूँ`,
    photo: (name) => `${name} की तस्वीर`,
    // [noun, "found" verb, possessive] per species, so the grammar fits: "मुझे यह बिल्ली मिली".
    species: { dog: ["कुत्ता", "मिला", "का"], cat: ["बिल्ली", "मिली", "की"], bird: ["पक्षी", "मिला", "का"],
               rabbit: ["खरगोश", "मिला", "का"], other: ["पशु", "मिला", "का"] },
    found: ([noun, verb]) => `मुझे यह ${noun} ${verb}`,
    owners: (owner, [noun, , of]) => `${owner} ${of} ${noun}`,
  },
  en: {
    loading: "Loading…",
    loadFailed: "Couldn't load. Check your internet and refresh.",
    notFoundTitle: "Tag not found",
    notFoundBody: "This QR code isn't linked to a pet. Check the code and try again.",
    lost: "🚨 I'm lost! Please help me get home.",
    call: "📞 Call my family",
    tellFamily: "Tell the family",
    yourName: "Your name",
    yourPhone: "Your phone number",
    phoneHint: "So they can call you back",
    message: "Message",
    messageHint: "Where did you find them? Are they safe with you?",
    shareLocation: "Share my current location",
    send: "Send to the family",
    sending: "Sending…",
    inactive: "This tag is no longer active.",
    tooMany: "Too many reports for this pet right now. Please try again later.",
    failed: "Something went wrong. Please try again.",
    thanksTitle: "Thank you!",
    thanksBody: "Your report was sent to the family's PetDost app. If you shared your number, they can call you back.",
    footer: "Every PetDost tag is private: we only show what the owner chooses to share.",
    hi: (name) => `Hi, I'm ${name}`,
    photo: (name) => `Photo of ${name}`,
    species: { dog: ["dog"], cat: ["cat"], bird: ["bird"], rabbit: ["rabbit"], other: ["pet"] },
    found: ([noun]) => `I found this ${noun}`,
    owners: (owner, [noun]) => `${owner}'s ${noun}`,
  },
};
let lang = "hi";
try { lang = localStorage.getItem("petdost-lang") || lang; } catch {}
let shownPet = null;
const t = (key) => TEXT[lang][key];

function applyLanguage() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll("[data-t-placeholder]")) el.placeholder = t(el.dataset.tPlaceholder);
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  if (shownPet) render(shownPet);
}

for (const b of document.querySelectorAll(".lang button")) {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("petdost-lang", lang); } catch {}
    applyLanguage();
  });
}
applyLanguage();

/** Server messages the finder can see, in the page language. */
function friendlyError(message) {
  if (/too many reports/i.test(message || "")) return t("tooMany");
  return t("failed");
}

async function rpc(name, body) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    body: JSON.stringify(body),
  });
  const data = await response.json().catch(() => null);
  if (!response.ok) throw new Error(friendlyError(data && data.message));
  return data;
}

function render(pet) {
  shownPet = pet;
  const kind = t("species")[pet.species] || t("species").other;
  // Owner-entered text is only ever inserted with textContent, never as HTML.
  $("petName").textContent = pet.is_lost ? t("hi")(pet.pet_name) : pet.pet_name;
  $("petMeta").textContent = [pet.breed, pet.owner_first_name && t("owners")(pet.owner_first_name, kind)].filter(Boolean).join(" · ");
  $("foundBtn").textContent = t("found")(kind);

  const slot = $("photoSlot");
  if (pet.photo_url && pet.photo_url.startsWith(`${SUPABASE_URL}/storage/`)) {
    const img = document.createElement("img");
    img.className = "photo";
    img.alt = t("photo")(pet.pet_name);
    img.src = pet.photo_url;
    slot.replaceChildren(img);
  } else {
    const initial = document.createElement("div");
    initial.className = "initial";
    initial.textContent = (pet.pet_name || "?").trim().charAt(0).toUpperCase();
    slot.replaceChildren(initial);
  }

  $("lostBanner").hidden = !pet.is_lost;
  $("lostMessage").textContent = pet.lost_message || "";
  $("lostMessage").hidden = !pet.lost_message;

  const phone = (pet.contact_phone || "").replace(/[^\d+]/g, "");
  if (phone) {
    $("callBtn").href = `tel:${phone}`;
    $("callBtn").hidden = false;
  }
  document.title = `${pet.pet_name} · PetDost`;
  show("pet");
}

function currentPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

$("foundBtn").addEventListener("click", () => {
  $("reportForm").hidden = false;
  $("foundBtn").hidden = true;
  $("reportForm").scrollIntoView({ behavior: "smooth" });
});

$("reportForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  $("formError").hidden = true;
  $("sendBtn").disabled = true;
  $("sendBtn").textContent = t("sending");
  try {
    const position = form.get("location") ? await currentPosition() : null;
    const ok = await rpc("report_sighting", {
      p_code: code,
      p_finder_name: form.get("name") || null,
      p_finder_phone: form.get("phone") || null,
      p_message: form.get("message") || null,
      p_latitude: position ? position.lat : null,
      p_longitude: position ? position.lng : null,
    });
    if (ok === false) throw new Error(t("inactive"));
    show("thanks");
  } catch (error) {
    $("formError").textContent = error.message;
    $("formError").hidden = false;
    $("sendBtn").disabled = false;
    $("sendBtn").textContent = t("send");
  }
});

(async () => {
  if (!/^[A-Z0-9]{6,16}$/.test(code)) return show("notFound");
  try {
    const rows = await rpc("public_tag", { p_code: code });
    rows && rows.length ? render(rows[0]) : show("notFound");
  } catch {
    $("loading").querySelector("p").textContent = t("loadFailed");
  }
})();
</script>
</body>
</html>
